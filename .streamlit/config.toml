[theme]
# Matches Sage & Stone (light) in dossierbuild/ui/theme.py. This only covers
# the first paint before the app CSS loads -- the live theme is driven by CSS
# variables so it can be switched at runtime, which a config file cannot do.
base = "light"
primaryColor = "#2C6A54"
backgroundColor = "#F7FAF8"
secondaryBackgroundColor = "#EDF3EF"
textColor = "#141E19"

[server]
headless = true

[client]
toolbarMode = "minimal"
