# Exact versions for the container image, applied as constraints:
#   pip install -r requirements.txt -c requirements.lock
#
# requirements.txt says what Dossierbuild needs; this file says which release
# of each the image is built from, so a new upstream release cannot change the
# image without a commit. It was resolved inside python:3.12-slim on linux,
# where uvicorn[standard] pulls in uvloop and httptools, so it is not meant
# for installing on Windows or macOS.
#
# To refresh it, build the image and run `pip freeze --exclude pip` inside it.
