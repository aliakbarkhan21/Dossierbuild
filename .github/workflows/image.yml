# The container image, published to GitHub's registry so that running
# Dossierbuild in Docker is one `docker run` rather than a clone and a build.
#
# Every push that changes what goes into the image builds it, so a Dockerfile
# that stopped building is caught on the branch that broke it rather than on
# main. Only main and version tags publish: `latest` follows main, and a tag
# such as v2.4.0 also publishes `2.4.0` and `2.4` for anyone who would rather
# pin a release. GitHub does not apply path filters to tag pushes, so a tag
# always builds.
#
# Two architectures, because the people who run things in Docker are on Apple
# Silicon or a Raspberry Pi as often as on x86. arm64 is built under QEMU; the
# frontend stage is not (see the Dockerfile).

name: Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - requirements.lock
      - "dossier/**"
      - "web/**"
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  image:
    name: Build, and publish from main and tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image name
        # The registry refuses capitals, and the repository is "Dossierbuild".
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
